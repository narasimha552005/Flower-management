<div class="auth-container">
  <div class="auth-bg"></div>
  <!-- Spinning accents -->
  <div class="hero-ring" style="position: absolute; width: 800px; height: 800px; border: 1px solid rgba(200,150,60,0.06); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); animation: spin 50s linear infinite;"></div>
  
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-brand-icon">✨</div>
      <h1 class="auth-title">Create Account</h1>
      <div class="auth-subtitle">Join the Heritage Portal</div>
    </div>

    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label" for="fullName">Full Name</label>
        <input 
          type="text" 
          id="fullName" 
          class="form-input" 
          formControlName="fullName" 
          placeholder="e.g. Ankem Suresh">
        <span *ngIf="signupForm.get('fullName')?.touched && signupForm.get('fullName')?.errors?.['required']" class="error-text">Name is required</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          class="form-input" 
          formControlName="email" 
          placeholder="Enter your email">
        <span *ngIf="signupForm.get('email')?.touched && signupForm.get('email')?.errors?.['email']" class="error-text">Valid email is required</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          class="form-input" 
          formControlName="password" 
          placeholder="e.g. Saiprasad@1234">
        <span *ngIf="signupForm.get('password')?.touched && signupForm.get('password')?.errors?.['required']" class="error-text">Password is required</span>
        <span *ngIf="signupForm.get('password')?.touched && signupForm.get('password')?.errors?.['passwordComplexity']" class="error-text">Must contain 1 upper, 1 lower, 1 number, 1 special char, 8+ length</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm Password</label>
        <input 
          type="password" 
          id="confirmPassword" 
          class="form-input" 
          formControlName="confirmPassword" 
          placeholder="Confirm password">
        <span *ngIf="signupForm.get('confirmPassword')?.touched && signupForm.errors?.['passwordsMismatch']" class="error-text">Passwords do not match</span>
      </div>

      <button type="submit" class="btn-primary" [disabled]="isSubmitting">
        <i class="fas fa-user-plus" *ngIf="!isSubmitting"></i>
        <span>{{ isSubmitting ? 'Creating...' : 'Sign Up' }}</span>
      </button>

      <div class="auth-links">
        Already have an account? <a (click)="goToLogin()">Sign in here</a>
      </div>
    </form>
  </div>
</div>
